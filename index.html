<!doctype html>
<html lang="fa">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">


<title>
Timeline Scheduler Smart Study
</title>


<style>

:root{

--scale:1;

--bg:#f7f8fb;

--surface:#ffffff;

--text:#111827;

--muted:#6b7280;

--border:#e5e7eb;

--primary:#2563eb;

--danger:#ef4444;

--warning:#f59e0b;

--success:#10b981;

}



html.dark{

--bg:#0f172a;

--surface:#1e293b;

--text:#f8fafc;

--muted:#94a3b8;

--border:#334155;

}



*{

box-sizing:border-box;

}



body{


margin:0;

padding:20px;

background:var(--bg);

color:var(--text);

font-family:

system-ui,
Tahoma,
sans-serif;


zoom:var(--scale);


}



.container{

max-width:900px;

margin:auto;


}



.card{


background:var(--surface);

border:1px solid var(--border);

border-radius:14px;

padding:14px;

margin-bottom:12px;


}




button,
input,
select{


font:inherit;

padding:9px;

border-radius:8px;

border:1px solid var(--border);

background:var(--surface);

color:var(--text);


}



button{

background:var(--primary);

color:white;

border:none;

cursor:pointer;

}



button.ghost{

background:transparent;

color:var(--text);

border:1px solid var(--border);

}



button.danger{

background:var(--danger);

}


button.warning{

background:var(--warning);

}



.row{

display:flex;

gap:8px;

align-items:center;

flex-wrap:wrap;


}




.task{


background:var(--surface);

border:1px solid var(--border);

border-radius:12px;

padding:10px;

margin-top:10px;


}



.task-title{

font-weight:800;

}



.small{

font-size:13px;

color:var(--muted);

}



.task-toolbar{


display:flex;

align-items:center;

gap:5px;

margin-top:8px;

overflow-x:auto;


}



.task-toolbar input,
.task-toolbar select,
.task-toolbar button{


height:32px;

min-height:32px;

font-size:13px;


}



.weight-input{

width:55px;

text-align:center;

}



.status-select{

width:90px;

}



.icon{

width:34px;

padding:0;

}



.modal{

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

display:none;

align-items:center;

justify-content:center;

z-index:999;


}



.modal-box{

background:var(--surface);

padding:20px;

border-radius:15px;

width:min(400px,90%);


}



.toast{


position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

background:#111;

color:white;

padding:12px 20px;

border-radius:12px;

display:none;


}


.toast.show{

display:block;

}



@media(max-width:600px){


body{

padding:10px;

}


.task-toolbar{

flex-wrap:nowrap;

}



}


</style>

</head>


<body>


<div class="container">


<header class="card">


<div>

<h2>
Timeline Scheduler
</h2>


<div class="small">
Smart Study Planner
</div>


</div>


<div class="row">


<button
id="settingsBtn"
class="ghost">

⚙

</button>


</div>


</header>



<section class="card">


<h3>
Add Task
</h3>


<div class="row">


<input
id="title"
placeholder="نام درس">


<input
id="start"
type="datetime-local">


<input
id="end"
type="datetime-local">


<input
id="weight"
class="weight-input"
type="number"
min="1"
max="10"
value="5"
placeholder="Weight">



<button
id="addBtn">

Add

</button>


</div>


</section>





<section class="card">


<h3>
Smart Rebalance
</h3>


<div class="row">


<button
id="rebalanceBtn">

⚖ Rebalance

</button>



</div>


</section>




<section
id="timeline">


</section>



</div>





<div
id="toast"
class="toast">

</div>


<div
id="settingsModal"
class="modal">


<div class="modal-box">


<h3>
Settings
</h3>


<label>

Zoom

<input
id="zoom"
type="range"
min="10"
max="130"
value="90">

</label>



<br><br>



<button
id="closeSettings">

Done

</button>



</div>

</div>
<script>

(function(){


const STORAGE_KEY =
"timeline_scheduler_final_v1";



let tasks=[];

let selectedTask=null;





// ===============================
// BASIC FUNCTIONS
// ===============================


function uid(){

return Date.now()
+
Math.random()
.toString(36)
.substring(2);


}



function save(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(tasks)

);


render();


}





function load(){

try{


tasks =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
||
"[]"

);


}catch(e){

tasks=[];

}


}






function showToast(text){


let box=
document
.getElementById("toast");


box.innerText=text;


box.classList.add("show");


setTimeout(()=>{


box.classList.remove("show");


},2000);



}







function formatTime(ms){


let d=
new Date(ms);


return (

String(d.getHours())
.padStart(2,"0")

+

":"

+

String(d.getMinutes())
.padStart(2,"0")

);


}





function duration(task){

return Math.round(
(task.end-task.start)
/60000
);


}









// ===============================
// ADD TASK
// ===============================



document
.getElementById("addBtn")
.onclick=function(){



let title=
document
.getElementById("title")
.value
.trim();



let start=
new Date(
document
.getElementById("start")
.value
)
.getTime();



let end=
new Date(
document
.getElementById("end")
.value
)
.getTime();




let weight=
Number(
document
.getElementById("weight")
.value
)
||5;





if(!title){

alert(
"نام درس را وارد کن"
);

return;

}




if(
!start ||
!end ||
end<=start
){

alert(
"زمان اشتباه است"
);

return;

}






tasks.push({

id:uid(),

title:title,


start:start,


end:end,


weight:
Math.max(
1,
Math.min(
10,
weight
)
),


locked:false,


status:"pending"


});





save();





document
.getElementById("title")
.value="";


};









// ===============================
// RENDER TIMELINE
// ===============================



function render(){



let box=
document
.getElementById("timeline");



box.innerHTML="";




if(
tasks.length===0
){

box.innerHTML=

`
<div class="card">
هنوز برنامه‌ای وجود ندارد
</div>
`;

return;


}







tasks
.sort(
(a,b)=>
a.start-b.start

)
.forEach(task=>{



let div=
document
.createElement("div");



div.className="task";





div.innerHTML=

`

<div class="task-title">

${task.title}

</div>


<div class="small">

${formatTime(task.start)}

-

${formatTime(task.end)}

|

${duration(task)} دقیقه

</div>



<div class="task-toolbar">


<label class="small">

W

<input

class="weight-input"

type="number"

min="1"

max="10"

value="${task.weight}"

>

</label>




<button
class="ghost icon lock">

${task.locked?"🔒":"🔓"}

</button>



<button
class="ghost icon edit">

⚙

</button>



<button
class="danger icon delete">

🗑

</button>



</div>

`;











// Weight Change

div
.querySelector(".weight-input")
.onchange=function(){


task.weight=
Number(this.value);



if(task.weight<1)
task.weight=1;


if(task.weight>10)
task.weight=10;



save();



};







// Lock


div
.querySelector(".lock")
.onclick=function(){


task.locked=
!task.locked;



save();


};






// Edit


div
.querySelector(".edit")
.onclick=function(){


editTask(task.id);



};






// Delete


div
.querySelector(".delete")
.onclick=function(){


deleteTask(task.id);


};






box.appendChild(div);



});



}









// ===============================
// EDIT
// ===============================



function editTask(id){



let task=
tasks.find(
t=>t.id===id
);



if(!task)
return;




let title=
prompt(
"نام درس:",
task.title
);



if(title){

task.title=title;

}




let weight=
prompt(
"Weight 1-10:",
task.weight
);



if(weight){

task.weight=
Math.max(
1,
Math.min(
10,
Number(weight)
)

);


}



save();



}









// ===============================
// DELETE
// ===============================



function deleteTask(id){



let index=
tasks.findIndex(
t=>t.id===id
);



if(index===-1)
return;





if(
confirm(
"حذف شود؟"
)

){


tasks.splice(
index,
1
);


save();


}



}







// ===============================
// SMART REBALANCE
// ===============================



document
.getElementById("rebalanceBtn")
.onclick=function(){



let flexible=
tasks.filter(
t=>!t.locked
);





if(
flexible.length===0
){

showToast(
"Task آزاد وجود ندارد"
);

return;

}





let start=
Math.min(
...flexible.map(
t=>t.start
)
);




let end=
Math.max(
...flexible.map(
t=>t.end
)
);




let totalTime=
end-start;





let weightSum=
flexible.reduce(
(a,t)=>
a+t.weight,
0
);





let cursor=start;





flexible
.sort(
(a,b)=>
a.start-b.start
)
.forEach(t=>{



let share=
totalTime*
(
t.weight/
weightSum
);




t.start=
cursor;


t.end=
cursor+share;



cursor=
t.end;



});






save();



showToast(
"Smart Rebalance انجام شد"
);



};







// ===============================
// SETTINGS
// ===============================



document
.getElementById("settingsBtn")
.onclick=function(){


settingsModal.style.display="flex";


};





document
.getElementById("closeSettings")
.onclick=function(){


settingsModal.style.display="none";


};






document
.getElementById("zoom")
.oninput=function(){


document
.documentElement
.style
.setProperty(
"--scale",
this.value/100
);


localStorage.setItem(
"zoom",
this.value
);



};







let oldZoom=
localStorage.getItem(
"zoom"
);



if(oldZoom){


zoom.value=oldZoom;


document
.documentElement
.style
.setProperty(
"--scale",
oldZoom/100
);


}





load();


render();



})();
<script>


// ===============================
// DELETE + SHIFT SYSTEM
// ===============================



let deleteTarget=null;



function openDelete(id){

deleteTarget=id;


let mode=
confirm(
"برای حذف و جلو کشیدن برنامه‌های بعدی OK بزن\n\nCancel = فقط حذف"
);



deleteTaskAdvanced(
id,
mode
);



}





function deleteTaskAdvanced(id,shift){



let index=
tasks.findIndex(
t=>t.id===id
);



if(index===-1)
return;




let removed=
tasks[index];



let gap=
removed.end-
removed.start;




tasks.splice(
index,
1
);





if(shift){



tasks
.filter(
t=>
t.start>=removed.end
&&
!t.locked

)
.forEach(t=>{


t.start-=gap;

t.end-=gap;


});


}





save();


showToast(
shift?
"Deleted + shifted":
"Deleted"

);



}









// ===============================
// REPLACE DELETE BUTTON ACTION
// ===============================


function connectDeleteButtons(){


document
.querySelectorAll(".delete")
.forEach(btn=>{


btn.onclick=function(){


let task=
this
.closest(".task");



let index=
Array
.from(
document
.querySelectorAll(".task")
)
.indexOf(task);



let id=
tasks[index]?.id;



if(id)
openDelete(id);



};


});


}












// ===============================
// FULL EDIT SYSTEM
// ===============================



function fullEdit(id){



let task=
tasks.find(
t=>t.id===id
);



if(!task)
return;




let start=
prompt(
"Start time:",
formatTime(task.start)
);



let end=
prompt(
"End time:",
formatTime(task.end)
);



if(start&&end){



let s=
start.split(":");

let e=
end.split(":");



let sd=
new Date(task.start);


sd.setHours(
Number(s[0]),
Number(s[1])
);



let ed=
new Date(task.start);


ed.setHours(
Number(e[0]),
Number(e[1])
);





if(ed<=sd)
ed.setDate(
ed.getDate()+1
);



task.start=
sd.getTime();


task.end=
ed.getTime();



}





save();



}





// ===============================
// SMART DELAY
// ===============================



function smartDelay(minutes){



let delay=
Number(minutes)
*
60000;



if(!delay)
return;






let now=
Date.now();





let future=
tasks
.filter(
t=>
t.start>=now
&&
!t.locked

)
.sort(
(a,b)=>
a.start-b.start
);






if(!future.length){

showToast(
"No future tasks"
);


return;


}






future
.forEach(task=>{


let factor=
100/
task.weight;



let move=
delay*
(
factor/10
);



task.start+=move;

task.end+=move;



});






save();



showToast(
"Smart Delay applied"
);



}









// ===============================
// UNDO SYSTEM
// ===============================



let lastSnapshot=null;





function snapshot(){


lastSnapshot=
JSON.stringify(tasks);


}




function undo(){



if(!lastSnapshot){

showToast(
"Nothing to undo"
);


return;

}



tasks=
JSON.parse(
lastSnapshot
);



save();


lastSnapshot=null;


}







// expose for testing

window.scheduler={

tasks,

smartDelay,

undo,

snapshot

};



</script>
<script>


// ===============================
// TODO SYSTEM
// ===============================


const TODO_KEY=
"timeline_scheduler_todos";


let todos=[];



function loadTodos(){


try{

todos=
JSON.parse(
localStorage.getItem(TODO_KEY)
||
"[]"
);


}catch{

todos=[];

}



}




function saveTodos(){


localStorage.setItem(
TODO_KEY,
JSON.stringify(todos)
);


renderTodos();


}






function renderTodos(){


let old=
document.getElementById(
"todoBox"
);



if(!old)
return;




old.innerHTML="";



todos.forEach(
(todo,i)=>{


let div=
document.createElement("div");



div.className="card";



div.innerHTML=

`

${todo}



<button
class="danger">

×


</button>


`;





div.querySelector("button")
.onclick=function(){


todos.splice(i,1);


saveTodos();


};





old.appendChild(div);



});



}









function addTodo(){



let text=
prompt(
"Task:"
);



if(!text)
return;



todos.push(text);



saveTodos();


}





// ===============================
// READY PROGRAM
// ===============================


const PROGRAM_KEY=
"timeline_scheduler_programs";



let programs=[];




function loadPrograms(){


try{


programs=
JSON.parse(
localStorage.getItem(PROGRAM_KEY)
||
"[]"
);



}catch{


programs=[];


}



}





function savePrograms(){


localStorage.setItem(
PROGRAM_KEY,
JSON.stringify(programs)
);


}







function saveCurrentProgram(){



let name=
prompt(
"Program name:"
);



if(!name)
return;



programs.push({

id:uid(),

name:name,

tasks:
JSON.parse(
JSON.stringify(tasks)
)


});




savePrograms();



showToast(
"Program saved"
);



}






function applyProgram(){



if(
programs.length===0
){

showToast(
"No program"
);

return;


}



let names=
programs
.map(
(p,i)=>
(i+1)+") "+p.name
)
.join("\n");



let choose=
Number(
prompt(
names
)
)
-1;



if(
!programs[choose]
)
return;




tasks=
JSON.parse(
JSON.stringify(
programs[choose].tasks
)
);



save();



showToast(
"Program loaded"
);



}









// ===============================
// EXPORT / IMPORT
// ===============================



function exportData(){


let blob=
new Blob(
[
JSON.stringify(
tasks,
null,
2
)
],
{
type:"application/json"
}
);



let a=
document.createElement("a");



a.href=
URL.createObjectURL(blob);



a.download=
"study-plan.json";



a.click();


}






function importData(){



let input=
document.createElement("input");


input.type="file";


input.accept=".json";



input.onchange=function(e){



let file=
e.target.files[0];


let reader=
new FileReader();



reader.onload=function(){


try{


tasks=
JSON.parse(
reader.result
);


save();



showToast(
"Imported"
);



}catch{


alert(
"Invalid file"
);



}


};



reader.readAsText(file);



};



input.click();



}








// ===============================
// CREATE EXTRA BUTTONS
// ===============================



let header=
document.querySelector("header");



let tools=
document.createElement("div");



tools.className="row";



tools.innerHTML=

`

<button
class="ghost">

📝 TO-DO

</button>


<button
class="ghost">

💾 Save Program

</button>



<button
class="ghost">

📂 Load Program

</button>


<button
class="ghost">

⬆ Export

</button>


<button
class="ghost">

⬇ Import

</button>


`;




header.appendChild(tools);





tools.children[0]
.onclick=
addTodo;


tools.children[1]
.onclick=
saveCurrentProgram;



tools.children[2]
.onclick=
applyProgram;



tools.children[3]
onclick=
exportData;



tools.children[4]
.onclick=
importData;








// ===============================
// INITIALIZE EXTRA DATA
// ===============================


loadTodos();

loadPrograms();





// ===============================
// FINAL OVERRIDES
// ===============================


window.addEventListener(
"beforeunload",
function(){

save();

saveTodos();

savePrograms();

}

);





})();
</script>


</body>

</html>
